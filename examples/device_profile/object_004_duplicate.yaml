schema_version: 1
base_frame: base_link
handeye_config: online_handeye.yaml
gripper_calibration: gripper_calibration.yaml

robot:
  urdf_package: agx_arm_description
  urdf_relative_path: agx_arm_urdf/piper_x/urdf/piper_x_description.urdf
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]

planning:
  # Every command is preflighted against the Piper X URDF. MoveJ selects the
  # intended pre-grasp branch; sampled IK verifies approach and lift continuity.
  minimum_joint_margin_deg: 5.0
  current_joint_limit_tolerance_deg: 2.0
  ik_position_tolerance_m: 0.0015
  ik_rotation_tolerance_deg: 1.5
  ik_restarts: 24
  joint_path_samples: 60
  cartesian_path_samples: 12
  maximum_initial_joint_move_deg: 135.0
  maximum_cartesian_joint_step_deg: 12.0
  joint_position_tolerance_deg: 2.0

object:
  id: object_003
  # This is the model_id published by the repaired object_003 package.
  foundationpose_model_id: model_plane_cleaned_fixed

motion:
  # The former 20 cm target put joint4 within about 2.5 degrees of its lower
  # limit.  Use a 15 cm pre-grasp, then make the final 5 cm a linear approach.
  pregrasp_standoff_m: 0.15
  camera_standoff_m: 0.10
  lift_m: 0.05
  stable_frames: 10
  stable_translation_m: 0.010
  stable_rotation_deg: 10.0
  stationary_tcp_frames: 6
  stationary_tcp_translation_m: 0.003
  stationary_tcp_rotation_deg: 2.0
  position_tolerance_m: 0.015
  rotation_tolerance_deg: 12.0
  minimum_motion_s: 0.50
  settle_required_samples: 6
  settle_translation_m: 0.0015
  settle_rotation_deg: 0.5
  settle_dwell_s: 0.15
  start_timeout_s: 4.0
  start_translation_m: 0.002
  start_rotation_deg: 0.5
  republish_after_s: 0.75
  timeout_s: 25.0

gripper:
  # The AGX driver and this calibrated unit both support 100 mm, but routine
  # opening stays at 95 mm so it does not repeatedly drive into the stop.
  open_width_m: 0.095
  open_limit_min_width_m: 0.092
  open_limit_dwell_s: 0.40
  open_limit_width_tolerance_m: 0.0006
  close_width_m: 0.040
  effort: 1.0
  speed_mps: 0.025
  acceleration_mps2: 0.050
  feedback_timeout_s: 0.35
  command_timeout_s: 7.0
  target_tolerance_m: 0.002
  contact_force: 0.25
  contact_dwell_s: 0.30
  contact_width_tolerance_m: 0.002
  minimum_close_travel_m: 0.003
  allow_unverified_close_fallback: false
  # Formal mode refuses to lift without force/width evidence. The legacy
  # three-second fallback remains available only through the explicit
  # --allow-unverified-close-fallback test switch.
  close_fallback_after_s: 3.0

safety:
  feedback_timeout_s: 0.50
  object_feedback_timeout_s: 0.75
  max_image_age_s: 1.50
  max_initial_move_m: 0.50
  # Conservative first-test TCP workspace in Piper base coordinates.
  workspace_m:
    x: [0.10, 0.70]
    y: [-0.40, 0.40]
    z: [0.015, 0.65]

topics:
  tcp_feedback: /feedback/tcp_pose
  joint_feedback: /feedback/joint_states
  arm_status: /feedback/arm_status
  gripper_status: /feedback/gripper_status
  object_pose_base: /foundationpose/object_pose_base
  object_pose_json: /foundationpose/object_pose_json
  recovery: /foundationpose/recovery_required
  move_p: /control/move_p
  move_l: /control/move_l
  move_j: /control/move_j
  joint_command: /control/joint_states
  frozen_object: /piper_control/frozen_object_pose
  grasp_target: /piper_control/grasp_target_pose
  pregrasp_joint_target: /piper_control/pregrasp_joint_target
  status: /piper_control/grasp_status
