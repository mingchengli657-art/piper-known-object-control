schema_version: 1
calibrated_on: 2026-09-05

device:
  arm_model: piper_x
  effector: agx_gripper
  firmware_profile: v189
  reported_firmware: S-V1.8-9

homing:
  # This device retained its zero across driver reconnect and a power cycle,
  # while CAN 0x2A8 status bit 7 remained false.  Treat that bit as advisory
  # for this exact firmware/device rather than silently pretending it is true.
  required: false
  observed_after_verified_zero: false

command_limits_m:
  min: 0.0
  max: 0.100

# Measured after the explicit zero calibration and a power cycle.  Keep a
# 5-mm margin below the physical stop for routine opening commands.
calibrated_physical_max_m: 0.100
normal_open_width_m: 0.095

feedback_limits_m:
  # Includes the measured -0.4 mm closed-position noise without permitting
  # implausible values such as the former -39/-63 mm bad-zero readings.
  min: -0.0015
  max: 0.1015

measured:
  closed_after_power_cycle_m: -0.0004
  command_0_010_feedback_m: 0.0097
  command_0_050_feedback_m: 0.0494
  command_0_100_feedback_m: 0.0997
  physical_max_inside_distance_m: 0.100
  empty_force_observed_n: [-0.031, 0.003]
  contact_command_force_n: 0.5
  contact_force_observed_n: [-0.523, -0.520]
  contact_width_observed_m: 0.0202

command_transport:
  # 0x159 is an absolute hardware target.  Repeat that same target only when
  # feedback has not completed it; never synthesize intermediate positions.
  retry_interval_s: 0.50
  max_attempts: 4

startup:
  # A repeatable intermediate opening below the physical end stop.  The
  # normal object profile may still request its independently configured
  # grasp opening after perception and IK preflight.
  safe_width_m: 0.080
  target_tolerance_m: 0.002
  minimum_response_m: 0.003
  # Live feedback around the 100 mm end showed 99.7--100.9 mm quantization /
  # settling spread.  Two millimetres rejects real reverse travel without
  # treating that measured 1.2 mm spread as a reversed command.
  direction_tolerance_m: 0.002
  settle_dwell_s: 0.25
  timeout_s: 7.0

opening_response:
  minimum_travel_m: 0.003
  minimum_step_m: 0.0005
  required_samples: 2
  direction_tolerance_m: 0.002
